services:
  postgres:
    image: postgres:15-alpine
    container_name: aip-postgres
    environment:
      POSTGRES_DB: aip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aip_password}
      TZ: America/New_York
    volumes:
      - aip-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: ./web
    container_name: aip-app
    network_mode: host
    extra_hosts:
      - "postgres:127.0.0.1"
    environment:
      TZ: America/New_York
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-aip_password}@localhost:5433/aip
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  aip-postgres-data:
