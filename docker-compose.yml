services:
  app:
    build: ./web
    container_name: aip-app
    network_mode: host
    extra_hosts:
      - "postgres:127.0.0.1"
    environment:
      TZ: America/New_York
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-fcc_password}@localhost:5433/aip
      # Auth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3004}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      SINGLE_USER_MODE: ${SINGLE_USER_MODE:-true}
      # OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # LLM (optional, used in single-user mode or as fallback)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      PORT: 3004
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
